services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: ghcr.io/fanroute-sync/fanroute-sync-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # application.yml의 spring.profiles.default가 "local"이라, 이 값을 안 주면
      # 운영 배포인데도 local 전용 컴포넌트(AuthDebugController 등)가 활성화된다.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KOPIS_SERVICE_KEY: ${KOPIS_SERVICE_KEY}
      TOUR_API_KEY: ${TOUR_API_KEY}
      # SecurityConfig.java의 corsConfigurationSource(@Value("${cors.allowed-origins}"))는
      # 기본값이 없는 필수값이라 이게 없으면 컨텍스트 초기화 단계에서 바로 크래시한다.
      # 콤마로 구분된 origin 목록 (Spring이 List<String>으로 변환)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # ponytail: t3.micro는 RAM 1GiB. postgres+redis+caddy와 공존하려면 JVM 힙을 제한해야 OOM이 안 난다.
      # 인스턴스 스펙을 올리면 이 값도 같이 올릴 것.
      JAVA_TOOL_OPTIONS: "-Xmx384m"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
