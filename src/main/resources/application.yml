server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fanroute-sync-api
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB # 파일 업로드 요청 시, 하나의 파일 크기를 10MB로 제한
      max-request-size: 100MB # 파일 업로드 요청 시, 모든 파일의 크기 합을 100MB로 제한

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FanRouteHikariPool
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

  jpa:
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC

  batch:
    job:
      enabled: false # 애플리케이션 시작 시 Job 자동 실행 방지
    jdbc:
      initialize-schema: always # Spring Batch 메타데이터 테이블 생성

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    issuer: https://accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  jwt:
    issuer: fanroute-sync-api
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh:
    token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P14D}
    cookie:
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

external-api:
  http:
    connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_API_READ_TIMEOUT:5s}
  services:
    google:
      base-url: ${GOOGLE_API_BASE_URL:https://oauth2.googleapis.com}
    tour:
      # 상대 경로가 KorService2 아래로 요청되도록 운영 그룹까지 포함합니다.
      base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    kopis:
      base-url: ${KOPIS_API_BASE_URL:http://www.kopis.or.kr/openApi/restful}

kopis:
  service-key: ${KOPIS_SERVICE_KEY}
  # KOPIS 지역코드(signgucode) 상위 코드. 정확한 부산 코드값은 KOPIS 공통코드 문서로 확인 필요
  region-code: ${KOPIS_REGION_CODE:26}
  sync-max-items: ${KOPIS_SYNC_MAX_ITEMS:0}

tour-api:
  service-key: ${TOUR_API_KEY}
  # TourAPI 4.4 법정동 시도 코드(lDongRegnCd), 부산=26
  legal-dong-region-code: ${TOUR_API_LEGAL_DONG_REGION_CODE:26}
  sync-max-items: ${TOUR_API_SYNC_MAX_ITEMS:0}

admin:
  # 로그인 시 ADMIN 권한을 부여할 이메일 목록
  bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
  read-timeout: ${GEMINI_READ_TIMEOUT:30s}
  core-pool-size: ${GEMINI_CORE_POOL_SIZE:2}
  max-pool-size: ${GEMINI_MAX_POOL_SIZE:4}
  queue-capacity: ${GEMINI_QUEUE_CAPACITY:20}

springdoc:
  swagger-ui:
    with-credentials: true

ai-generation:
  notification:
    enabled: ${AI_GENERATION_NOTIFICATION_ENABLED:false}
    batch-size: ${AI_GENERATION_NOTIFICATION_BATCH_SIZE:20}
    poll-delay: ${AI_GENERATION_NOTIFICATION_POLL_DELAY:1s}
    processing-lease: ${AI_GENERATION_NOTIFICATION_PROCESSING_LEASE:30s}
    max-attempts: ${AI_GENERATION_NOTIFICATION_MAX_ATTEMPTS:3}
    initial-delay: ${AI_GENERATION_NOTIFICATION_RETRY_INITIAL_DELAY:2s}
    max-delay: ${AI_GENERATION_NOTIFICATION_RETRY_MAX_DELAY:60s}
    jitter-ratio: ${AI_GENERATION_NOTIFICATION_RETRY_JITTER_RATIO:0.2}
  retry:
    max-attempts: ${AI_GENERATION_MAX_ATTEMPTS:3}
    initial-delay: ${AI_GENERATION_RETRY_INITIAL_DELAY:2s}
    max-delay: ${AI_GENERATION_RETRY_MAX_DELAY:60s}
    jitter-ratio: ${AI_GENERATION_RETRY_JITTER_RATIO:0.2}
  stream:
    key: ${AI_GENERATION_STREAM_KEY:fanroute:ai-generation:v1}
    group: ${AI_GENERATION_STREAM_GROUP:ai-generation-workers}
    consumer: ${AI_GENERATION_STREAM_CONSUMER:${HOSTNAME:local}}
    outbox-poll-delay: ${AI_GENERATION_OUTBOX_POLL_DELAY:1s}
    publish-lease: ${AI_GENERATION_OUTBOX_PUBLISH_LEASE:30s}
    processing-lease: ${AI_GENERATION_PROCESSING_LEASE:45s}
    claim-min-idle: ${AI_GENERATION_CLAIM_MIN_IDLE:60s}
    claim-poll-delay: ${AI_GENERATION_CLAIM_POLL_DELAY:1s}
    read-block: ${AI_GENERATION_READ_BLOCK:1s}
    consumer-poll-delay: ${AI_GENERATION_CONSUMER_POLL_DELAY:100ms}
    worker-concurrency: ${AI_GENERATION_WORKER_CONCURRENCY:2}
