name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fanroute-sync/fanroute-sync-api:latest
            ghcr.io/fanroute-sync/fanroute-sync-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Redeploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "curl -fsSL https://raw.githubusercontent.com/fanroute-sync/fanroute-sync-api/develop/deploy/docker-compose.yml -o /opt/troadie/docker-compose.yml",
              "aws ssm get-parameter --name /troadie/env-file --with-decryption --query Parameter.Value --output text --region ap-northeast-2 > /opt/troadie/.env",
              "install -d -m 700 /opt/troadie/secrets",
              "aws ssm get-parameter --name /troadie/firebase-service-account --with-decryption --query Parameter.Value --output text --region ap-northeast-2 > /opt/troadie/secrets/firebase-service-account.json",
              "chmod 600 /opt/troadie/secrets/firebase-service-account.json",
              "cd /opt/troadie && docker compose pull && docker compose up -d"
            ]'
